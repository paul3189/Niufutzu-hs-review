<script>window.V2_PREVIEW={"unit_code":"6Q","unit":"數列與級數","intro":["數列與級數在近五年學測數A 一共出現 4 題 20 分（111 第 4 題、112 第 7、9 題、114 第 7 題），分數不算多。不過另外還有 7 次，數列是別題的中間步驟：多項式的三根成等差、三角形的三邊成等差、三點等距共線、矩陣推出的遞迴式、機率的 $1-0.9^n$、指數的 $f(c_2)/f(c_1)$，這些題都要先看懂數列才做得下去。","所以這個單元不必背很多公式，要練熟的是四個動作：**看到「差固定」就寫 $a_n=a_1+(n-1)d$、看到「比固定」就寫 $a_n=a_1r^{n-1}$、看到「一整排相加」就找 $\\sum$ 的公式或裂項、看到「用前一項描述下一項」就先算出前五項**。最後學數學歸納法，把從前幾項猜出來的規律證明清楚。","**先備與去向**：要先會兩件事，一是指對數單元的對數律（取一次 $\\log$，等比就變成等差），二是多項式單元裡「三個數成等差」的寫法。學完之後接到數據分析單元（幾何平均、等差排列的資料平均就是正中間那一筆）、矩陣單元（由 $A^2=2A+I$ 推出的遞迴式）與機率單元（算完機率後出現的 $1-0.9^n$ 是等比）。"],"exam_map":[{"node":"Q1","title":"等差數列與級數","heat":"高","exam":["112-7"],"points":5,"note":"112 第 7 題用階梯式調薪包裝等差級數。另有三次是別題的關鍵步驟：113 第 3 題（三次方程式的三根成等差）、113 第 8 題（三角形三邊成等差）、115 第 15 題（三點等距共線就是 $2y_2=y_1+y_3$，等差中項的另一個樣子）。"},{"node":"Q2","title":"等比數列與級數","heat":"中","exam":["111-4","112-9"],"points":10,"note":"111 第 4 題與 112 第 9 題都是「取對數讓等比與等差互換」。另外 115 第 3 題（指數函數上的等差自變數）與 112 第 8 題（$1-0.9^n$ 的差是等比不是等差）也靠同一個觀念收尾。"},{"node":"Q3","title":"$\\sum$ 與級數求和","heat":"中","exam":[],"points":0,"note":"五年沒有單獨出過一題求和公式，因為它一直是別題的工具：112 第 9 題的交錯級數要兩兩配對再分奇偶，就是本節點的大考長相。"},{"node":"Q4","title":"遞迴數列","heat":"中","exam":["114-7"],"points":5,"note":"114 第 7 題給你換元後的數列 $\\langle b_n\\rangle$，要你驗證它是等比。115 第 8 題則是由矩陣關係式 $A^2=2A+I$ 推出 $c_{n+2}=2c_{n+1}+c_n$；這種題目會把關係式直接給你，照著往下算幾項就好。"},{"node":"Q5","title":"數學歸納法","heat":"低","exam":[],"points":0,"note":"近五年學測沒有考過，但它是課本教的工具，段考的混合題幾乎每年都考同一組三小題：先算前幾項、再猜一般項、最後證明。值得花半節課練熟。"}],"nodes":[{"id":"Q1","title":"等差數列與級數","heat":"高","count":9},{"id":"Q2","title":"等比數列與級數","heat":"中","count":10},{"id":"Q3","title":"$\\sum$ 與級數求和","heat":"中","count":7},{"id":"Q4","title":"遞迴數列","heat":"中","count":9},{"id":"Q5","title":"數學歸納法","heat":"低","count":4}]};</script>
