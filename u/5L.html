<script>window.V2_PREVIEW={"unit_code":"5L","unit":"直線與圓","intro":["「坐標幾何」是近五年學測數A 配分最重的一塊（⑤ 坐標幾何與向量占 38.2%），而本單元的「直線・圓・區域・平面圖形」五年合計 50 分、占全卷 10.0%，僅次於空間與平面向量。","這個單元要學兩件事：**把幾何條件寫成坐標與方程式**，以及**把距離、面積、角度寫成算得出來的式子**。七個節點先講直線，再講圓，最後把整個圖形放上坐標；每個節點都附上近五年學測數A 的實際考法。","本單元用到的工具不多：遇到**夾角**就用法向量（或方向向量）的內積、遇到**角平分線**就用「到兩邊等距」、遇到**過某交點的直線或圓**就先把交點解出來再寫方程式。這三種做法沒有例外情形要背（鉛直線、互相垂直都照用），後面的平面向量與空間向量也會繼續用同一套寫法。","先備的是數與式的「絕對值就是距離」、多項式的配方，以及三角比裡「斜率就是斜角的 $\\tan$」。學完之後，這一套坐標寫法會直接接到平面向量（同樣的幾何條件改用向量寫）、空間向量（距離、投影、夾角的公式只多一個分量），以及數據分析的最適直線（斜率讀成「$x$ 每增加一單位，$y$ 平均變化多少」）。"],"exam_map":[{"node":"L1","title":"斜率與直線方程式","heat":"高","exam":["112-10","114-2"],"points":10,"note":"112 考含參數直線族的端點範圍、114 考截距式算面積差；是 G-01 的入門形式。"},{"node":"L2","title":"距離、對稱點與最短路徑","heat":"高","exam":["112-20","115-6"],"points":11,"note":"115 用中垂線數等腰三角形、112 混合題用點到直線距離求梯形的高；另在 113-9、115-15 當次考點。"},{"node":"L3","title":"兩直線的關係與三角形的三線","heat":"高","exam":["111-6","114-20"],"points":11,"note":"111 考正三角形的三線合一（角平分線 ⊥ 對邊）、114 混合題用兩直線交點與斜角差收尾。"},{"node":"L4","title":"二元一次不等式與區域","heat":"低","exam":["115-7"],"points":5,"note":"五年只出現一次，考兩個半平面的交集落在哪些象限；113-17 的區域面積題也用同一套工具。"},{"node":"L5","title":"圓的方程式與圓上的點","heat":"中","exam":[],"points":0,"note":"圓的方程式近五年沒有單獨當過主考點，但 L6、L7 每一題都要用到它；114 年第 8 題的後半段也整段在用它，那一題的主軸是指數方程式，收在指數與對數單元練。"},{"node":"L6","title":"圓與直線的關係","heat":"中","exam":["114-16"],"points":8,"note":"114 考「一條相割給距離、一條相切給半徑」再算弦長；111-18 的兩個距離條件定點也屬這一類，該題隨題組收在主題④ 的 4A。"},{"node":"L7","title":"平面圖形的坐標化","heat":"中","exam":["113-10"],"points":5,"note":"113-10 把正方形與正六邊形放進坐標系，用「恰有一個交點」定邊長；111-15、112-20、115-10 都以它當次考點。"}],"nodes":[{"id":"L1","title":"斜率與直線方程式","heat":"高","count":10},{"id":"L2","title":"距離、對稱點與最短路徑","heat":"高","count":14},{"id":"L3","title":"兩直線的關係與三角形的三線","heat":"高","count":6},{"id":"L4","title":"二元一次不等式與區域","heat":"低","count":4},{"id":"L5","title":"圓的方程式與圓上的點","heat":"中","count":10},{"id":"L6","title":"圓與直線的關係","heat":"中","count":11},{"id":"L7","title":"平面圖形的坐標化","heat":"中","count":4}]};</script>
