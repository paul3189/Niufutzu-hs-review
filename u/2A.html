<script>window.V2_PREVIEW={"unit_code":"2A","unit":"多項式的運算與方程式","intro":["多項式是高中代數的主線。近五年學測數A 在這個單元一共考了 **5 題 25 分**，其中 **餘式** 幾乎每年一題選填（$111$、$112$、$113$ 年連三年），是全書 CP 值最高的節點之一。","這一整個單元其實只圍著一個式子打轉：$f(x)=(\\text{除式})\\times(\\text{商式})+(\\text{餘式})$。把它讀熟，餘式定理、因式定理、根與因式的關係都是它的推論；連「係數和」「代大數求值」這類看起來不相干的題目，也都是同一條式子的代值。","五個節點依學習脈絡排列：先把多項式的四則與恆等式弄清楚（A1），再談除法原理與綜合除法（A2），接著是最熱門的餘式定理與餘式的設法（A3），然後把餘式為零的情形獨立出來談因式與根（A4），最後回到二次方程式，用判別式判斷根的個數與性質（A5）。","先備的是數與式單元的乘法公式與化簡手感。學完之後，這裡的工具會往四個方向接出去：**根與圖形**接到下一個單元（方程式 $f(x)=0$ 的根，就是圖形與 $x$ 軸的交點）；**根與係數**在三角單元收尾（114 學測第 17 題的圓內接四邊形只求兩根的和與積）、在數列單元變成等差中項（113 學測第 3 題的三根成等差）；**比較係數**在向量與矩陣單元原封不動再用一次（115 學測第 5 題）；而**降次**——用一條關係式把最高次換掉——到了矩陣與三角函數單元換了外衣還是同一個動作。"],"exam_map":[{"node":"A1","title":"多項式的運算與恆等式","heat":"低","exam":["114B-6"],"points":0,"note":"近五年數A 沒有單獨命題，但「代特殊值讓多數項歸零」是 $114$ 學測數B 第 $6$ 題的全部，也是後面每個節點的基本動作。"},{"node":"A2","title":"除法原理與綜合除法","heat":"中","exam":["113B-9"],"points":0,"note":"「餘式的次數一定比除式低」這一句話，$113$ 學測數B 第 $9$ 題整題在考；$108$ 學測第 $12$ 題也是同一句話的五種變形。"},{"node":"A3","title":"餘式定理與餘式的設法","heat":"高","exam":["111-12","112-14","113-14"],"points":15,"note":"近五年最穩定的考點：$111$、$112$、$113$ 三年連考，題型固定在「設餘式 → 代根或降次 → 解聯立」。"},{"node":"A4","title":"因式定理、根的結構與根與係數","heat":"中","exam":["113-3"],"points":5,"note":"$113$ 學測數A 第 $3$ 題把「三根成等差」寫成因式分解後代 $x=0$；$114$ 學測第 $17$ 題也靠根與係數收尾。"},{"node":"A5","title":"二次方程式的判別式與根的性質","heat":"中","exam":["114-9"],"points":5,"note":"$114$ 學測數A 第 $9$ 題用「兩個判別式相減」夾出 $b$ 的範圍，再逐選項找反例，是判別式題的新長相。"}],"nodes":[{"id":"A1","title":"多項式的運算與恆等式","heat":"低","count":5},{"id":"A2","title":"除法原理與綜合除法","heat":"中","count":8},{"id":"A3","title":"餘式定理與餘式的設法","heat":"高","count":19},{"id":"A4","title":"因式定理、根的結構與根與係數","heat":"中","count":11},{"id":"A5","title":"二次方程式的判別式與根的性質","heat":"中","count":4}]};</script>
