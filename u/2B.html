<script>window.V2_PREVIEW={"unit_code":"2B","unit":"多項式函數的圖形與不等式","intro":["多項式有兩個身分：它是一個**可以做除法的式子**，也是一條**畫得出來的曲線**。上一個單元處理的是式子，這一個單元處理的是曲線。","把兩個身分接起來的只有一句話：**方程式 $f(x)=0$ 的根，就是圖形與 $x$ 軸的交點**；而 **$f(x)\\gt0$ 的解，就是圖形在 $x$ 軸上方的那幾段**。這一句話是本單元所有題目的萬能翻譯機。","近五年學測數A 在這個單元考了 **5 題 28 分**，其中**三次函數的對稱中心一個人就佔了 15 分**（111、114、115 年各一題），是整個多項式主題最熱的考點。它的解法只有一條路：把式子配成 $a(x-h)^3+p(x-h)+k$，中心就是 $(h,k)$，中心附近的一次近似就是 $y=p(x-h)+k$。","本單元用五個節點把工具依學習脈絡排好：先把一次與二次函數的圖形、配方與平移弄熟（F1），接著是限制區間上的最值（F2），然後進到年年出現的三次函數大域特徵與對稱中心（F3），再把平移、鏡射、奇偶對稱整理成一套（F4），最後回到不等式，用圖形與數線把符號一次判完（F5）。","先備的是上一個單元的根與因式，加上數與式單元「把根標在數線上判號」的習慣。學完之後，這裡的兩招會一直回來：**配方**在直線與圓單元把圓的一般式整理成標準式、在平面向量單元把 $\\left| \\vec a+t\\vec b \\right|^2$ 化成 $t$ 的二次式求最小值（115 學測第 14 題）、在數據分析單元推出「誤差平方和最小」的最適直線；**由圖形判號**則從一條數線升級成平面上的半平面（直線與圓單元）。另外，$y=f(x-s)+t$ 這張平移伸縮表，在指數與對數、三角函數、數據分析三個單元還會各用一次。"],"exam_map":[{"node":"F1","title":"一次與二次函數的圖形：配方、頂點與平移","heat":"中","exam":["115-16"],"points":5,"note":"115 年考「平移後頂點仍在同一條直線上」，兩個頂點都要自己配方算出來；另有 111-12、115-14 兩題的第二步也是配方。"},{"node":"F2","title":"二次函數的最大最小值與限制區間","heat":"中","exam":["115-14","111-12"],"points":0,"note":"近五年沒有單獨出題，但 115 年第 14 題與 111 年第 12 題的最後一步都是配方求最大值，段考更是必考。"},{"node":"F3","title":"三次函數的大域特徵、對稱中心與一次近似","heat":"高","exam":["111-10","114-13"],"points":10,"note":"本單元最熱的一塊：111 年給對稱中心反推係數、114 年把除法與商式的最大值包在外面，核心都是 $h=-\\frac{b}{3a}$ 與中心式。"},{"node":"F4","title":"圖形的平移、鏡射與奇偶對稱","heat":"高","exam":["115-12"],"points":5,"note":"115 年考兩個三次圖形的中心能不能被唯一決定；另外 111、114 那兩題的選項裡也各藏了一個「平移能不能重合」與「一次近似的斜率」。"},{"node":"F5","title":"多項式不等式與由圖形判號","heat":"中","exam":["113-20"],"points":8,"note":"113 年的非選最後一小題就是先解二次不等式定出範圍，再在那個範圍上求最小值——不等式與最值常常綁在一起考。"}],"nodes":[{"id":"F1","title":"一次與二次函數的圖形：配方、頂點與平移","heat":"中","count":11},{"id":"F2","title":"二次函數的最大最小值與限制區間","heat":"中","count":10},{"id":"F3","title":"三次函數的大域特徵、對稱中心與一次近似","heat":"高","count":15},{"id":"F4","title":"圖形的平移、鏡射與奇偶對稱","heat":"高","count":6},{"id":"F5","title":"多項式不等式與由圖形判號","heat":"中","count":8}]};</script>
