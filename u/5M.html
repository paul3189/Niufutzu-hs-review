<script>window.V2_PREVIEW={"unit_code":"5M","unit":"矩陣","intro":["矩陣與線性方程組近五年學測數A 共 9 題、44 分（占全卷 8.8%），而且 112 年起每年穩定 9～10 分，已經是固定配額。","近三年沒有一題是「單純算矩陣」：113 年把方程組解的情形綁上條件機率，114 年的混合題由旋轉矩陣接到極坐標與兩直線的交點，115 年把矩陣綁上解的個數與遞迴數列。所以本單元每一節都安排了「矩陣＋別的單元」的題目。","本單元分七節：先用增廣矩陣解聯立方程組（M1）、判斷解的情形與三平面的幾何意義（M2）；接著學矩陣的運算與反方陣（M3），再把矩陣看成平面上的變換（M4）、用行列式看面積與可逆性（M5）、處理高次方（M6），最後是轉移矩陣（M7）。","先備的是平面向量的線性組合與二階行列式面積、空間中的三平面關係，還有三角的極坐標與和角公式（旋轉矩陣裡的每一格就是和角公式算出來的）。學完之後，解的判定會接到機率單元（113 學測有一題把 $\\Delta$ 當成一個事件），高次方會接到數列的遞迴（115 學測）。"],"exam_map":[{"node":"M1","title":"高斯消去法與增廣矩陣","heat":"中","exam":["111-14","112-13"],"points":10,"note":"111-14 由化簡後的增廣矩陣反推原方程組的係數；112-13 是三元一次應用題，一步消去兩個未知數。"},{"node":"M2","title":"解的判定與三平面的關係","heat":"中","exam":["113-11"],"points":5,"note":"113-11 用骰子與硬幣決定係數，先判斷二元方程組解的情形，再算（條件）機率。"},{"node":"M3","title":"矩陣的運算與反方陣","heat":"低","exam":[],"points":0,"note":"五年沒有單獨出題，但每一題矩陣題都要用到乘法與反方陣，是後面四節的共同工具。"},{"node":"M4","title":"線性變換：旋轉、鏡射、伸縮、推移","heat":"高","exam":["112-11","114-18"],"points":8,"note":"112-11 直接寫出旋轉與鏡射矩陣相乘比較；114 題組第 18 題由「$A^2$ 是旋轉矩陣」定出旋轉角。"},{"node":"M5","title":"行列式、面積比與可逆性","heat":"高","exam":["113-12","115-5"],"points":10,"note":"113-12 用行列式一次處理可逆與面積、推移軸上的點不動；115-5 不求矩陣，用線性組合判斷解有無窮多個，最後回到解的個數。"},{"node":"M6","title":"矩陣的高次方","heat":"高","exam":["114-19","115-8"],"points":11,"note":"114-19 旋轉矩陣的次方就是角度相加（接極坐標）；115-8 先乘出 $A^2=2A+I$，再得每個位置的遞迴（接數列）。"},{"node":"M7","title":"轉移矩陣","heat":"低","exam":[],"points":0,"note":"五年沒有出現；會寫轉移矩陣、會求幾期後的比例與穩定狀態即可。"}],"nodes":[{"id":"M1","title":"高斯消去法與增廣矩陣","heat":"中","count":8},{"id":"M2","title":"解的判定與三平面的關係","heat":"中","count":10},{"id":"M3","title":"矩陣的運算與反方陣","heat":"低","count":9},{"id":"M4","title":"線性變換：旋轉、鏡射、伸縮、推移","heat":"高","count":18},{"id":"M5","title":"行列式、面積比與可逆性","heat":"高","count":10},{"id":"M6","title":"矩陣的高次方","heat":"高","count":10},{"id":"M7","title":"轉移矩陣","heat":"低","count":2}]};</script>
