<script>window.V2_PREVIEW={"unit_code":"3B","unit":"指對數函數的圖形與應用","intro":["指數與對數這一章有兩個面向。**算**的那一面（指數律、對數律、換底、科學記號）放在前一個單元；這個單元要處理的是**圖形**與**應用**——把 $y=a^x$ 與 $y=\\log_a x$ 當成兩條看得見的曲線，用它們的長相回答問題。","整個單元其實只靠三件事：**單調**（底數大於 $1$ 就一路上升，介於 $0$ 與 $1$ 之間就一路下降）、**定義域**（對數的真數一定要大於 $0$）、以及**兩條曲線對稱於直線 $y=x$**。比大小、解不等式、數交點、判斷平移伸縮，全都能回到這三件事。","應用題的骨架則永遠是同一句話：**每經過固定的一段時間，量就乘上固定的倍率**。半衰期、複利、細菌繁殖、藥物代謝都是它；分貝、地震規模、pH 值則是把這句話反過來寫成對數。所以先把模型寫成 $y=A\\cdot r^{\\frac{t}{T}}$ 或 $y=k\\log x+b$，剩下的就只是代入。","**先備**有兩樣：前一個單元的運算功夫（指數律、對數律、換底），以及多項式函數單元那張平移、伸縮與對稱的表——這裡只是把同一張表套到兩條新曲線上。**學完之後會接到三個地方**：數列單元的等比數列（成長模型就是等比的連續版本，公比換成每期的倍率）；數據分析的平均成長率與半對數圖（兩邊取一次對數，彎的散布圖就被拉直成一條最適直線）；還有計數原理——要數對數曲線下方有幾個格子點時，定義域與曲線負責框出範圍，範圍裡有幾個點則交給分類加法一行一行數。"],"exam_map":[{"node":"B1","title":"指數函數與對數函數的圖形","heat":"中","exam":[],"points":0,"note":"近五年學測數A 沒有單獨考，但它是本單元其他四個節點的共同底盤；早年學測（102 第 8 題、104 第 7 題）直接考單調性與圖形上的點。"},{"node":"B2","title":"圖形的平移、伸縮與對稱","heat":"中","exam":[],"points":0,"note":"「換底等於縱向伸縮、乘常數等於平移」是段考的高頻題型；大考則把它藏在「哪些圖形完全相同」裡（113 第 7 題）。"},{"node":"B3","title":"對數函數的定義域與圖形上的點","heat":"高","exam":["113-7","114-4"],"points":10,"note":"本單元分數最高的節點。113 第 7 題考「$\\log x^2$ 比 $2\\log x$ 多一段」；114 第 4 題把 $y=\\log_{2}x$ 底下的格子點逐行數出來。兩題的關鍵都是定義域。"},{"node":"B4","title":"指對數不等式與圖形交點的判讀","heat":"中","exam":[],"points":0,"note":"近五年學測數A 沒有單獨考，但 91 學測第 10 題那種「畫個草圖就知道有沒有交點」的判斷，是處理 113 第 7 題與 114 第 4 題的必要功夫。"},{"node":"B5","title":"成長、衰減與生活中的指對數模型","heat":"高","exam":["113-1"],"points":5,"note":"113 第 1 題（藥物半衰期）是五年內唯一一題純模型題，難度不高，重點在「$2$ 小時減半」要寫成 $\\left(\\frac{1}{2}\\right)^{t/2}$ 而不是線性遞減。"}],"nodes":[{"id":"B1","title":"指數函數與對數函數的圖形","heat":"中","count":10},{"id":"B2","title":"圖形的平移、伸縮與對稱","heat":"中","count":7},{"id":"B3","title":"對數函數的定義域與圖形上的點","heat":"高","count":8},{"id":"B4","title":"指對數不等式與圖形交點的判讀","heat":"中","count":10},{"id":"B5","title":"成長、衰減與生活中的指對數模型","heat":"高","count":10}]};</script>
