<script>window.V2_PREVIEW={"unit_code":"5S","unit":"空間向量與平面直線","intro":["空間是近五年學測數A 最吃重的一塊：外積與三重積 $31$ 分、空間平面與直線 $27$ 分、空間位置關係 $5$ 分，五年合計 $63$ 分，而且**每一年都考**。$113$ 與 $115$ 兩年的混合題題組也都是空間題。","本單元分成九個節點：先把點放進坐標（S1）、看懂立體圖形裡的垂直（S2），接著是內積（S3）與空間唯一的新工具——外積（S4）與三重積（S5）；外積一旦會用，平面方程式（S6）、距離／投影／夾角（S7）、直線（S8、S9）都是它的延伸。","全單元的共同心法：**找法向量**。平面的方程式、點到平面的距離、投影點、對稱點、兩平面夾角、歪斜線距離，最後都是「法向量＋內積」。","先備的是平面向量的一整套語言，加上三角比（把空間角化成直角三角形）與直線和圓的距離公式。學完之後，三階行列式會接到矩陣單元的面積倍率與解的判定；而 $113$ 學測第 $18$～$20$ 題的最後一小題，會一路走回多項式函數的二次式最值。",{"type":"box","style":"link","title":"串聯：平面向量學過的，空間再用一次","to":["5V-V1","5V-V4"],"body":[{"type":"table","header":["在這裡怎麼寫","那個單元怎麼寫"],"rows":[["空間中的點 $(x,y,z)$、長度 $\\sqrt{x^2+y^2+z^2}$","平面向量是 $(x,y)$、長度 $\\sqrt{x^2+y^2}$，只差一個分量"],["分點、線性組合、用係數和 $=1$ 判共線，寫法一字不改","平面向量單元怎麼寫，這裡就怎麼寫"],["內積 $x_1x_2+y_1y_2+z_1z_2$，夾角與正射影的公式完全相同","平面向量的內積是 $x_1x_2+y_1y_2$"],["三階行列式算體積；**外積**是這個單元唯一全新的工具","平面向量用二階行列式算面積"]]}]}],"exam_map":[{"node":"S1","title":"空間坐標與空間向量的基本運算","heat":"低","exam":[],"points":0,"note":"五年沒有單獨出題，但每一題空間題的第一步都是把點放進坐標。"},{"node":"S2","title":"空間中的位置關係：三垂線、兩面角、截面","heat":"中","exam":["111-11"],"points":5,"note":"111-11 直三角柱：線垂直面之後，兩面角與各個空間角都化成直角三角形。"},{"node":"S3","title":"空間內積：夾角、正射影、柯西不等式","heat":"中","exam":["112-6","113-19"],"points":9,"note":"112-6 正立方體先設坐標，再用內積的坐標式數出結果；113-19 由夾角範圍推出不等式（平方前先說明同號）；112-17、113-18 也用內積收尾。"},{"node":"S4","title":"外積：法向量與面積","heat":"高","exam":["113-2","115-18"],"points":8,"note":"113-2 正方體設坐標算外積；115-18 外積長度就是平行四邊形面積。"},{"node":"S5","title":"三階行列式與體積（三重積）","heat":"高","exam":["111-17","112-5","114-6","115-20"],"points":23,"note":"四年都考：底面積×高、行列式＝內積、兩兩垂直的長方體、由三個外積還原三向量。"},{"node":"S6","title":"平面方程式","heat":"高","exam":["111-16","115-19"],"points":9,"note":"111-16 投影重合 ⟹ 兩個垂直條件 ⟹ 外積；115-19 外積直接當法向量。"},{"node":"S7","title":"點到平面距離、投影點與對稱點、兩平面夾角","heat":"高","exam":["112-16","113-18","114-14"],"points":13,"note":"112-16 外心再沿法向量走；113-18 投影點；114-14 距離公式配正負號。113-20 也從平面方程式出發。"},{"node":"S8","title":"空間直線：參數式、比例式、直線與平面","heat":"中","exam":[],"points":0,"no
