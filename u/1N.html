<script>window.V2_PREVIEW={"unit_code":"1N","unit":"數與式","intro":["「數與式」是整份數學的入口：後面每一章最後都要靠這一章的工具，把式子化成你認得的樣子。","近五年學測數A 在這個主題只占 $15$ 分（$3\\%$），而且題型非常集中——絕對值的方程式與不等式、實數與數線上的判斷，再加上一題「題目自己定義新符號」的讀題題。所以這一章的複習策略是：**把少數幾招練到變成反射動作**，不必花時間在偏門的變形上。","整章分成四個節點：實數與數線、絕對值就是距離、絕對值不等式、乘法公式與根式。前三個彼此相連（都在數線上發生），第四個是化簡用的工具箱。","先備的只有國中的數線與絕對值，不必另外補課；真正的回收在後面。學完之後，這一章的工具會一路被別的單元借去用：絕對值不等式兩邊平方，剩下的就是多項式單元的二次不等式；「絕對值就是距離」搬到坐標平面是點到直線的距離公式、搬到空間是點到平面的距離公式，形狀完全一樣，只多一個分量；乘法公式與算幾不等式是後面各章化簡與求最值時的常備工具；而題目臨時定義的取整符號，這幾年最常出現在數列與期望值的題幹裡。"],"exam_map":[{"node":"N1","title":"實數與數線","heat":"中","exam":["115-2","112B-9"],"points":5,"note":"115 年考「題目自己定義的取整符號」，是近三年每年一題的新題型；數B 則愛用一條數線同時問有理無理、中點與整數個數。"},{"node":"N2","title":"絕對值就是數線上的距離","heat":"中","exam":["113-17","114B-1"],"points":5,"note":"113 年把距離條件搬到坐標平面上問（該題收在直線與圓）；數B 則直接考距離和的解數。不論外包裝如何，第一步永遠是把式子讀成距離。"},{"node":"N3","title":"絕對值不等式","heat":"中","exam":["111-7"],"points":5,"note":"111 年用一題多選把「兩邊平方」「移項成分式」「直接去絕對值」三種變形的對錯一次考完；舊年度的 103 年則考解完之後的區間長度。"},{"node":"N4","title":"乘法公式、根式與算幾不等式","heat":"低","exam":[],"points":0,"note":"近五年沒有單獨出過題，但它是別章化簡時的常備工具；只要把對稱式、雙重根號、算幾不等式各練一題，維持手感就夠。"}],"nodes":[{"id":"N1","title":"實數與數線","heat":"中","count":6},{"id":"N2","title":"絕對值就是數線上的距離","heat":"中","count":12},{"id":"N3","title":"絕對值不等式","heat":"中","count":8},{"id":"N4","title":"乘法公式、根式與算幾不等式","heat":"低","count":8}]};</script>
