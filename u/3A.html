<script>window.V2_PREVIEW={"unit_code":"3A","unit":"指數與對數的運算","intro":["指數與對數是學測數A 的常客：近五年一共考了 **8 題 40 分**，其中**屬於「算」這一半的有 5 題 25 分**（112 年第 1 題、115 年第 3 題考指數律，114 年第 8 題考指數方程式，111 年第 2 題、115 年第 15 題考對數律與換底），這五題全部收在本單元。","這個單元要把指數與對數當成一套**搬運工具**練熟：指數律把不同底的數字搬到同一個底，對數律把乘除變成加減、把次方移到前面，換底公式把任何底換成常用對數。大考這幾題問的，大多是你能不能把式子整理到同一個底再比較。","五個節點依學習脈絡排：先把指數律與分數指數練熟（E1），接著用它解指數方程式（E2）；再把對數的定義與對數律接上（E3），用換底把不同底的對數統一並解對數方程式（E4）；最後回到十進位，處理科學記號、位數與最高位數字（E5）。","這個單元在全書的位置也很清楚。**先備**只有兩樣：數與式單元的根式化簡與分數指數讀法，以及多項式單元「把式子整理成同一組東西再比較係數」的代數習慣。**學完之後會接到四個地方**：下一個單元把 $y=a^{x}$ 與 $y=\\log_{a} x$ 畫成看得見的曲線（圖形與成長模型）；數列單元的等比數列，取一次對數就變回等差；數據分析的平均成長率與半對數圖，取對數可以把彎的散布圖拉直；還有直線與圓，指數同底比較完、對數律併完之後，剩下的條件常常就是一個圓或「三點共線」。"],"exam_map":[{"node":"E1","title":"指數律與分數指數、根式化簡","heat":"高","exam":["112-1","115-3"],"points":10,"note":"兩年各一題，都是「把所有東西改寫成同一個底的次方」就結束；115 年那題外面包了一層等差與等比數列。"},{"node":"E2","title":"指數方程式：同底比較與換元","heat":"中","exam":["114-8"],"points":5,"note":"114 年第 8 題是這一節的典型題：兩邊各自化成 $2$ 的次方、同底比較指數之後，留下一條二次關係式（配方後是一個圓），五個選項全部由它判斷。"},{"node":"E3","title":"對數的定義與對數律","heat":"高","exam":["115-15"],"points":5,"note":"115 年第 15 題把「三點共線」翻譯成 $y$ 坐標等差，再用對數律把三個 $\\log$ 併成一個；近年常見這種包裝。"},{"node":"E4","title":"換底公式、常用恆等式與對數方程式","heat":"高","exam":["111-2"],"points":5,"note":"111 年第 2 題考的是 $\\log_{a} b$ 與 $\\log_{b} a$ 互為倒數。段考則常把換底和二次方程式放在同一題。"},{"node":"E5","title":"常用對數：科學記號、位數與最高位數字","heat":"中","exam":[],"points":0,"note":"近五年沒有單獨出過，但 110 年選填 E、109 年第 11 題都用到；大考卷最後一頁會附 $\\log 2$、$\\log 3$、$\\log 5$、$\\log 7$ 四個值，這一節就是教你怎麼用它們。"}],"nodes":[{"id":"E1","title":"指數律與分數指數、根式化簡","heat":"高","count":11},{"id":"E2","title":"指數方程式：同底比較與換元","heat":"中","count":8},{"id":"E3","title":"對數的定義與對數律","heat":"高","count":8},{"id":"E4","title":"換底公式、常用恆等式與對數方程式","heat":"高","count":9},{"id":"E5","title":"常用對數：科學記號、位數與最高位數字","heat":"中","count":6}]};</script>
