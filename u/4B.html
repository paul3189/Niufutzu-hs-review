<script>window.V2_PREVIEW={"unit_code":"4B","unit":"三角函數：公式、圖形與疊合","intro":["高一下的三角比只處理「一個角的比值」，這一個單元把它升級成**函數**：角可以是任意實數，值域固定在一段區間裡，圖形是一條反覆出現的波。","近五年學測數A 的三角題，重心正從「解三角形」移到這裡：和差角、倍角、半角合計 20 分，疊合 5 分，圖形 10 分，共 35 分，而且 113、114、115 連續三年每年都有 10 分。","七個考點節點照學習的順序排：先把量角的尺從角度換成**弧度**（B0），接著是**和差角**（B1），倍角半角（B2）是它的特例，會化簡之後才能**解方程式**（B3）；把兩項合成一項是**疊合**（B4），疊合完就是一條標準的正弦波，接著看它的**四參數**（B5）與**對稱性**（B6）。","**先備與去向**：先備的是三角比與解三角形單元（三角比、廣義角、正弦與餘弦定理），還有多項式函數單元那張平移與伸縮的表。學完之後，這裡的工具會接到：空間向量與平面直線單元（體積或長度的最後一步常常是把 $a\\cos t+b\\sin t$ 合成一項再取極值，111 學測有一題就是）；矩陣單元（連轉兩次的展開式，逐項對起來就是和角公式）；數列單元（對稱軸與對稱中心的「兩端到中間等距」，換個場景就是等差中項）。"],"exam_map":[{"node":"B0","title":"弧度量、弧長與扇形","heat":"中","exam":["111-20"],"points":6,"note":"111 學測有一題用「兩個扇形相減」算掃過的面積，扇形公式直接派上用場（同年第 19 題與 112-19 考的是極坐標與廣義角，歸 `4A`）。"},{"node":"B1","title":"和角與差角公式","heat":"中","exam":["113-4"],"points":5,"note":"113-4 把 $\\sin(x+\\frac{\\pi}{6})$ 展開後提出公因式 $\\sin\\frac{x}{2}$；和差角也是 107-5、115-17 的第一步。"},{"node":"B2","title":"倍角、半角與降次","heat":"高","exam":["113-6","115-17"],"points":10,"note":"113-6 由 $\\cos\\theta=\\frac{7}{18}$ 用半角求 $\\cos\\frac{\\theta}{2}$；115-17 先定出 $\\sin\\theta=\\frac{1}{4}$ 再用倍角接和角算 $\\tan3\\theta$。"},{"node":"B3","title":"三角方程式與不等式","heat":"中","exam":["114-5"],"points":5,"note":"114-5 用倍角把兩個不等式都化成 $\\sin\\theta$、$\\cos\\theta$ 的因式，再取交集；113-4 的收尾也是解方程式。"},{"node":"B4","title":"正餘弦疊合與極值","heat":"中","exam":["112-12"],"points":5,"note":"112-12 把 $\\sin x+\\sqrt3\\cos x$ 疊成 $2\\sin(x+\\frac{\\pi}{3})$ 之後，接著問對稱軸、解的個數與平移重合。"},{"node":"B5","title":"三角函數的圖形：四參數、週期與值域","heat":"中","exam":[],"points":0,"note":"五年沒有單獨當主考點，但 112-12 的第 (5) 個選項、114-10 與 115-11 的第一步都是它；段考與模考常考「由圖讀四參數」。"},{"node":"B6","title":"對稱軸、對稱中心與圖形的交點","heat":"高","exam":["114-10","115-11"],"points":10,"note":"114-10 把三個交點寫成「對稱軸 $\\pm t$」，四個選項都用這個寫法判斷；115-11 看的是「$(0,1)$ 恆在兩圖形上」與值域 $[-1,1]$。"}],"nodes":[{"id":"B0","title":"弧度量、弧長與扇形","heat":"中","count":6},{"id":"B1","title":"和角與差角公式","heat":"中","count":9},{"id":"B2","title":"倍角、半角與降次","heat":"高","count":9},{"id":
