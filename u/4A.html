<script>window.V2_PREVIEW={"unit_code":"4A","unit":"三角比與解三角形","intro":["三角比是「把角度換成比值」的工具：只要一個角，就能把三角形的邊長、面積、甚至地面上量不到的距離全部連起來。本單元從直角三角形的 $\\sin$、$\\cos$、$\\tan$ 出發，經過三角測量、廣義角與極坐標，最後用正弦定理與餘弦定理把任意三角形解開。至於**弧度與扇形**，它是替三角函數量角用的新單位，安排在三角函數單元的第一節，那裡有完整的說明。","近五年學測數A，屬於本單元的一共 $8$ 題、$40$ 分。值得注意的是它的長相正在改變：$111$、$112$ 年還有整組的極坐標非選題，到 $115$ 年已經沒有單獨出題；但同一段時間裡，它以「中間步驟」的身分出現在空間、平面向量、矩陣與坐標幾何的題目裡至少七次。換句話說，這一單元現在的角色是**別的題目的地基**——工具要熟、速度要快，但不必為它花太多時間鑽難題。","讀這個單元時，建議隨時準備一張草稿紙畫圖：三角的題目十題有八題是「圖畫對了就解一半」。","**先備與去向**：先備的是國中的相似形與畢氏定理，加上數與式單元的根式化簡。學完之後，這裡的工具會一路接下去——三角函數單元把比值升級成函數（弧度、和差角、把兩項合成一項都從這裡長出來）；直線與圓單元把 $\\tan$ 換個名字叫斜率；平面向量單元的夾角公式和餘弦定理是同一條式子的兩種寫法；空間向量與平面直線單元把每個空間角都化回一個直角三角形；矩陣單元描述旋轉時，每一格填的就是 $\\cos$ 與 $\\sin$。"],"exam_map":[{"node":"A1","title":"銳角三角比、特別角與斜角","heat":"中","exam":["112-2"],"points":5,"note":"近五年只單獨考過一題，但 111-11、112-18、113-6、115-17 都把它當中間步驟，是全單元用得最頻繁的工具。"},{"node":"A2","title":"三角測量：仰角、俯角與方位角","heat":"中","exam":[],"points":0,"note":"近五年學測數A 沒有單獨出題，但它是段考與指考分科的常客，也是 111-15 土地徵收題的底層想法。"},{"node":"A3","title":"廣義角三角比與極坐標","heat":"中","exam":["111-19","112-19"],"points":12,"note":"111、112 兩年都出現在最後的非選題組裡；112-19 見坐標幾何與向量單元的題組，111-20 的扇形面積見三角函數單元。"},{"node":"A5","title":"正弦定理、餘弦定理與外接圓","heat":"高","exam":["111-8","113-8","112-18"],"points":13,"note":"本單元配分最高的一段，111 到 114 年年出現；112-18 見坐標幾何與向量單元的題組。"},{"node":"A6","title":"三角形面積與解三角形的綜合","heat":"高","exam":["111-15","114-17"],"points":10,"note":"常和圓、相似形、根與係數綁在一起；114-17 就是「外接圓上找一點」的經典配置。"}],"nodes":[{"id":"A1","title":"銳角三角比、特別角與斜角","heat":"中","count":9},{"id":"A2","title":"三角測量：仰角、俯角與方位角","heat":"中","count":8},{"id":"A3","title":"廣義角三角比與極坐標","heat":"中","count":11},{"id":"A5","title":"正弦定理、餘弦定理與外接圓","heat":"高","count":15},{"id":"A6","title":"三角形面積與解三角形的綜合","heat":"高","count":10}]};</script>
