<script>window.V2_PREVIEW={"unit_code":"6P","unit":"機率與期望值","intro":["機率是有限數學裡分量最重的一塊：近五年學測數A 在這個單元一共考了 **9 題 45 分**，平均每年 9 分，而且**年年都考**。","它的題目長相很固定：算一個樣本空間、判斷兩件事互不互相影響、在一個已知的條件下重新算一次機率、或是把每一種結果的金額乘上機率加起來。只要把「樣本空間」與「條件」這兩件事講清楚，這一章的題目就會變得很像同一題。","本單元用七個節點把這些工具依學習脈絡排好：先把樣本空間與古典機率的定義弄清楚（P1），接著是機率的四則性質（P2），然後是判斷兩事件互不影響的獨立（P3），再進到縮小樣本空間的條件機率（P4）與反過來推的貝氏定理（P5），最後兩節專攻年年出現的期望值（P6、P7）。","**先備與去向**：先備兩件事——排列組合單元（分子與分母都要靠它數出來，三條原理到這裡原封不動再用一次），以及數列與級數單元（算完機率之後常常還要判斷那一串數是等差還是等比）。學完之後接到數據分析單元（期望值就是把權數換成機率的加權平均）與矩陣單元（轉移矩陣是樹狀圖的矩陣寫法）。"],"exam_map":[{"node":"P1","title":"古典機率與樣本空間","heat":"高","exam":["110-C"],"points":5,"note":"所有機率題的入口；近五年的 113-15、114-15 都要先把樣本空間數清楚才動得了。"},{"node":"P2","title":"機率的性質：餘事件與加法定理","heat":"中","exam":["114B-13"],"points":5,"note":"「至少……」幾乎一律改算餘事件；114 學測數B 第 13 題就是最乾淨的示範。"},{"node":"P3","title":"獨立事件與重複試驗","heat":"高","exam":["114-1","112-8"],"points":10,"note":"112 年考「至少中獎一次」的餘事件、114 年考「用乘法判獨立」，兩年各一題，是 D-10 的全部內容。"},{"node":"P4","title":"條件機率","heat":"高","exam":["110-7","110-12"],"points":10,"note":"近年愛用表格或排列當外殼；重點永遠是「分母換成哪一群人」。"},{"node":"P5","title":"全機率與貝氏定理","heat":"高","exam":["111-5","115-13"],"points":10,"note":"111 年與 115 年各一題，題型固定：先畫兩層樹，再用「分子是其中一條路徑、分母是全部路徑」收尾。"},{"node":"P6","title":"期望值的定義與計算","heat":"高","exam":["115-1","112-6"],"points":10,"note":"115 年第 1 題是最基本的 $E=\\sum x_i p_i$；112 年第 6 題把隨機變數換成內積，仍是同一個式子。"},{"node":"P7","title":"期望值的線性、公平與決策","heat":"高","exam":["111-13","113-15","114-15"],"points":15,"note":"近五年最密集的一塊：三年三題，都是「先把每一種情況的金額算出來，再把機率乘上去」。"}],"nodes":[{"id":"P1","title":"古典機率與樣本空間","heat":"高","count":10},{"id":"P2","title":"機率的性質：餘事件與加法定理","heat":"中","count":7},{"id":"P3","title":"獨立事件與重複試驗","heat":"高","count":11},{"id":"P4","title":"條件機率","heat":"高","count":10},{"id":"P5","title":"全機率與貝氏定理","heat":"高","count":10},{"id":"P6","title":"期望值的定義與計算","heat":"高","count":10},{"id":"P7","title":"期望值的線性、公平與決策","heat":"高","count":9}]};</script>
