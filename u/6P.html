<script>window.V2_PREVIEW={"unit_code":"6P","unit":"機率與期望值","intro":["機率是有限數學裡分量最重的一塊：近五年學測數A 在這個單元一共考了 **9 題 45 分**，平均每年 9 分，而且**年年都考**。","它的題目長相很固定：算一個樣本空間、判斷兩件事互不互相影響、在一個已知的條件下重新算一次機率、或是把每一種結果的金額乘上機率加起來。把「樣本空間」與「條件」這兩件事講清楚，大部分題目的做法就很接近了。","本單元分成七個節點：先弄清楚樣本空間與古典機率的定義（P1），接著是餘事件、加法定理這些機率的性質（P2），然後是判斷兩事件互不影響的獨立（P3），再進到縮小樣本空間的條件機率（P4）與反過來推的貝氏定理（P5），最後兩節是年年出現的期望值（P6、P7）。","**先備與去向**：先備有兩個單元。一是排列組合，分子與分母都要靠它數出來，加法、乘法、取捨三條原理在這裡照樣用；二是數列與級數，算完機率之後常常還要判斷那一串數是等差還是等比。學完之後會接到數據分析（期望值就是把權數換成機率的加權平均）與矩陣（轉移矩陣是樹狀圖的矩陣寫法）。"],"exam_map":[{"node":"P1","title":"古典機率與樣本空間","heat":"高","exam":["110-C"],"points":5,"note":"每一題機率都從這裡開始；近五年的 113-15、114-15 都要先把樣本空間數清楚才算得下去。"},{"node":"P2","title":"機率的性質：餘事件與加法定理","heat":"中","exam":["114B-13"],"points":5,"note":"看到「至少……」，通常改算餘事件比較快；114 學測數B有一題是很好的例子。"},{"node":"P3","title":"獨立事件與重複試驗","heat":"高","exam":["114-1","112-8"],"points":10,"note":"112 年考「至少中獎一次」的餘事件、114 年考「用乘法判獨立」，兩年各一題，D-10 考的就是這兩件事。"},{"node":"P4","title":"條件機率","heat":"高","exam":["110-7","110-12"],"points":10,"note":"近年常用表格或排列出題；每一題都要先確認「分母換成哪一群人」。"},{"node":"P5","title":"全機率與貝氏定理","heat":"高","exam":["111-5","115-13"],"points":10,"note":"111 年與 115 年各一題，題型固定：先畫兩層樹，分子是其中一條路徑，分母是所有同結果的路徑加起來。"},{"node":"P6","title":"期望值的定義與計算","heat":"高","exam":["115-1"],"points":5,"note":"115 年第 1 題是最基本的 $E=\\sum x_i p_i$；112 年第 6 題（內積的期望值）歸在空間向量單元。"},{"node":"P7","title":"期望值的線性、公平與決策","heat":"高","exam":["111-13","113-15","114-15"],"points":15,"note":"近五年考最多的一塊，三年三題，做法都是先把每一種情況的金額算出來，再乘上各自的機率相加。"}],"nodes":[{"id":"P1","title":"古典機率與樣本空間","heat":"高","count":10},{"id":"P2","title":"機率的性質：餘事件與加法定理","heat":"中","count":7},{"id":"P3","title":"獨立事件與重複試驗","heat":"高","count":11},{"id":"P4","title":"條件機率","heat":"高","count":10},{"id":"P5","title":"全機率與貝氏定理","heat":"高","count":10},{"id":"P6","title":"期望值的定義與計算","heat":"高","count":10},{"id":"P7","title":"期望值的線性、公平與決策","heat":"高","count":9}]};</script>
