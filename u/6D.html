<script>window.V2_PREVIEW={"unit_code":"6D","unit":"數據分析","intro":["數據分析是有限數學裡最穩定的一塊：近五年學測數A 每一年都有題，五年合計 **35 分**，而且七題全部落在同一節的內容上。","題目問的不外乎兩類。**一維**：一堆數字，中心在哪（平均數、中位數、眾數、加權平均）、散得多開（全距、四分位距、標準差）、某個人排在哪（百分位數、標準化分數）。**二維**：兩個量會不會一起變（散布圖、相關係數），以及用其中一個預測另一個（最適直線）。","整個單元的計算量都很小，難的是**讀懂題目在問哪一個統計量**，以及**把定義寫對**。所以每一節都從「這個量是怎麼定義的」開始，再看大考怎麼把它包裝成生活情境。","**先備與去向**：要先會四樣東西：數列與級數單元的平均與等差、指對數單元的取對數與幾何平均、多項式函數單元的平移與伸縮、平面向量單元的內積與正射影。這是全書最後一個單元，用到的多半是前面學過的工具，只是換成統計的名稱；看到新名詞時，先找它對應到哪一個舊工具。"],"exam_map":[{"node":"D1","title":"集中量數：平均數、中位數、眾數與加權平均","heat":"高","exam":["113-5","113-13"],"points":10,"note":"113 一年就考兩題：第 13 題是純加權平均列方程式，第 5 題用中位數的位置性質定出兩個數，再算組合數。"},{"node":"D2","title":"延伸：全距、四分位距與百分位數","heat":"低","exam":[],"points":0,"note":"近五年學測數A 沒有單獨出題，當成 D1 的延伸看過即可：會算位置、知道位置是不是整數就夠用（數B 113 第 1 題考過一題）。"},{"node":"D3","title":"標準差與變異數","heat":"中","exam":[],"points":0,"note":"很少單獨出一整題，但 113 第 9 題、114 第 12 題、115 第 9 題都要先算標準差，所以要算得快、算得準。"},{"node":"D4","title":"線性變換與標準化","heat":"高","exam":["115-9"],"points":5,"note":"115 第 9 題的 T 分數就是標準化再做一次線性變換；換單位、全班調分也是同樣的做法。"},{"node":"D5","title":"散布圖與相關係數","heat":"高","exam":["111-3"],"points":5,"note":"111 第 3 題要先看出散布圖的資料沿哪個方向延伸；113 第 9 題也要用到相關係數與斜率的關係。"},{"node":"D6","title":"最適直線","heat":"高","exam":["112-3","113-9","114-12"],"points":15,"note":"本單元最高分的節點，題也配得最多。112 把指數關係取對數拉直、114 換單位、113 反推標準差，三種變化各考一次；數B 115 第 10 題則是整組資料乘一個倍數。"}],"nodes":[{"id":"D1","title":"集中量數：平均數、中位數、眾數與加權平均","heat":"高","count":9},{"id":"D2","title":"延伸：全距、四分位距與百分位數","heat":"低","count":4},{"id":"D3","title":"標準差與變異數","heat":"中","count":10},{"id":"D4","title":"線性變換與標準化","heat":"高","count":6},{"id":"D5","title":"散布圖與相關係數","heat":"高","count":8},{"id":"D6","title":"最適直線","heat":"高","count":17}]};</script>
