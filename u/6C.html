<script>window.V2_PREVIEW={"unit_code":"6C","unit":"排列組合","intro":["計數要做的，是把方法數算清楚。用到的原理只有加法與乘法兩條，可是這一節很容易「看得懂題目卻算錯」，失分幾乎都出在兩件事：有沒有重複數到、有沒有漏掉。","近五年學測數A 有四年考了計數題（111 第 1 題、112 第 4 題、114 第 3 題、115 第 4 題），合計 $20$ 分。這四題的樣子很像：**題幹是生活情境，規則要讀兩遍，用到的工具通常只有一種**。所以這個單元要練的是：先把「一個結果長什麼樣子」講清楚，再決定要分類還是分步驟。","另外，計數也是機率題的工具：機率 $=\\frac{\\text{合條件的結果數}}{\\text{全部的結果數}}$，分子分母都要靠本單元算出來。","**先備與去向**：本單元只需要國中就熟悉的樹狀圖，可以直接開始；學完之後會用在三個地方：機率單元（分類相加、分步驟相乘、取捨原理三條規則原封不動再用一次）、指對數函數單元的格子點計數（114 學測第 4 題把「固定 $x$ 逐行數、再把每一行加起來」搬到對數曲線下方），以及矩陣單元的轉移矩陣（同一張樹狀圖改用矩陣一次算完所有路徑）。"],"exam_map":[{"node":"C1","title":"計數原理：窮舉、加法與乘法原理、取捨原理","heat":"中","exam":["115-4"],"points":5,"note":"115 學測數A 第 4 題整題就是先分類、再把各類相加；111-1、114-3、114-4 也都先靠它把情況切開，是本單元用得最頻繁的一步。106 學測第 7 題（午餐計畫）則是另一種長相：限制多、但天數少，有系統地把情況列完最快。"},{"node":"C2","title":"排列：直線排列與重複排列","heat":"中","exam":["114-3"],"points":5,"note":"114 學測數A 第 3 題用捆綁法；近五年的排列題都是「先分類再排」，沒有出過需要特殊技巧的題型。97 學測第 4 題（車牌號碼）則示範重複排列配上「全部扣掉違規」。"},{"node":"C3","title":"組合與分組分物","heat":"高","exam":["112-4"],"points":5,"note":"112 學測數A 第 4 題考的是「順序已經被規定好，排列就變成組合」；113 學測數A 第 5 題也用到 $C^{24}_{12}$（那一題的主考點在數據分析）。分組分物最常考的一點，是 90 學測第 J 題的「隊伍沒有編號就要除以隊數的階乘」。"},{"node":"C4","title":"重複組合與隔板法","heat":"高","exam":["111-1"],"points":5,"note":"111 學測數A 第 1 題直接考 $H$；114 學測數A 第 15 題的機率題也拿它數樣本空間。「被分的東西是相同的」是它的使用前提。"},{"node":"C5","title":"二項式定理、巴斯卡公式與組合恆等式","heat":"低","exam":[],"points":0,"note":"近五年學測數A 沒有單獨出題，但它是組合數最重要的應用，段考幾乎每次都考，也是把一堆組合數的和一次算完的工具。"}],"nodes":[{"id":"C1","title":"計數原理：窮舉、加法與乘法原理、取捨原理","heat":"中","count":12},{"id":"C2","title":"排列：直線排列與重複排列","heat":"中","count":9},{"id":"C3","title":"組合與分組分物","heat":"高","count":8},{"id":"C4","title":"重複組合與隔板法","heat":"高","count":7},{"id":"C5","title":"二項式定理、巴斯卡公式與組合恆等式","heat":"低","count":4}]};</script>
